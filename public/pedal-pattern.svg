<svg xmlns="http://www.w3.org/2000/svg" width="880" height="620" viewBox="0 0 880 620">
  <!--
    Seamless tile for the hero backdrop.

    Every pedal sits fully inside the viewBox with margin to spare. Shapes at
    negative coordinates or past the right edge get clipped by the viewBox, and
    that hard cut at each repeat is what makes the backdrop read as several
    panels butted together rather than one continuous field.

    Six enclosure types, all drawn in the same 2:1 isometric projection. The
    top face of each is a diamond: top (cx, y), right (cx+w, y+h), bottom
    (cx, y+2h), left (cx-w, y+h).

    Controls follow the box's own axes rather than being scattered across the
    face. On a diamond, a row of knobs across the pedal's width runs along
    (+w, -h) - up and to the right - and anything front-to-back runs along
    (+w, +h). Placing knobs on a symmetric arc or a zigzag instead is what made
    the earlier version look like buttons dropped at random.
  -->
  <defs>
    <linearGradient id="topFace" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <defs>
    <!-- Compact stompbox - three knobs in a row, one footswitch. -->
    <symbol id="box" viewBox="0 0 150 128">
      <ellipse cx="75" cy="112" rx="58" ry="13" fill="#05070f" opacity="0.45" />

      <path d="M8 46 L75 84 L75 108 L8 70 Z" fill="currentColor" opacity="0.5" />
      <path d="M142 46 L75 84 L75 108 L142 70 Z" fill="currentColor" opacity="0.3" />
      <path d="M75 8 L142 46 L75 84 L8 46 Z" fill="currentColor" />
      <path d="M75 8 L142 46 L75 84 L8 46 Z" fill="url(#topFace)" />

      <!-- Knobs on the width axis: step (20, -11.3). -->
      <g fill="#0b1020">
        <ellipse cx="55" cy="51" rx="7" ry="4.2" />
        <ellipse cx="75" cy="40" rx="7" ry="4.2" />
        <ellipse cx="95" cy="29" rx="7" ry="4.2" />
      </g>
      <g stroke="#e8edf7" stroke-width="1.4" stroke-linecap="round" opacity="0.85">
        <line x1="55" y1="51" x2="52" y2="48.6" />
        <line x1="75" y1="40" x2="75" y2="36.6" />
        <line x1="95" y1="29" x2="98" y2="26.6" />
      </g>

      <ellipse cx="75" cy="18" rx="4" ry="2.4" fill="#f8fafc" opacity="0.9" />

      <ellipse cx="75" cy="72" rx="13" ry="7.5" fill="#0b1020" opacity="0.75" />
      <ellipse cx="75" cy="70.5" rx="8.5" ry="5" fill="#cbd5e1" opacity="0.55" />
    </symbol>

    <!-- Mini pedal - one knob, one switch. -->
    <symbol id="mini" viewBox="0 0 100 100">
      <ellipse cx="50" cy="86" rx="39" ry="9" fill="#05070f" opacity="0.45" />

      <path d="M5 34 L50 60 L50 78 L5 52 Z" fill="currentColor" opacity="0.5" />
      <path d="M95 34 L50 60 L50 78 L95 52 Z" fill="currentColor" opacity="0.3" />
      <path d="M50 8 L95 34 L50 60 L5 34 Z" fill="currentColor" />
      <path d="M50 8 L95 34 L50 60 L5 34 Z" fill="url(#topFace)" />

      <ellipse cx="50" cy="27" rx="8" ry="4.8" fill="#0b1020" />
      <line
        x1="50" y1="27" x2="53" y2="24.4"
        stroke="#e8edf7" stroke-width="1.4" stroke-linecap="round" opacity="0.85"
      />
      <ellipse cx="50" cy="17" rx="3.2" ry="2" fill="#f8fafc" opacity="0.9" />

      <ellipse cx="50" cy="47" rx="10" ry="5.8" fill="#0b1020" opacity="0.75" />
      <ellipse cx="50" cy="45.8" rx="6.5" ry="3.8" fill="#cbd5e1" opacity="0.55" />
    </symbol>

    <!-- Long 1590BB-style slab - four knobs in a row, one footswitch. -->
    <symbol id="slab" viewBox="0 0 220 170">
      <ellipse cx="110" cy="146" rx="88" ry="16" fill="#05070f" opacity="0.45" />

      <path d="M10 66 L110 122 L110 148 L10 92 Z" fill="currentColor" opacity="0.5" />
      <path d="M210 66 L110 122 L110 148 L210 92 Z" fill="currentColor" opacity="0.3" />
      <path d="M110 10 L210 66 L110 122 L10 66 Z" fill="currentColor" />
      <path d="M110 10 L210 66 L110 122 L10 66 Z" fill="url(#topFace)" />

      <!-- Knobs on the width axis: step (24, -13.4). -->
      <g fill="#0b1020">
        <ellipse cx="60" cy="78" rx="7.5" ry="4.5" />
        <ellipse cx="84" cy="64.6" rx="7.5" ry="4.5" />
        <ellipse cx="108" cy="51.2" rx="7.5" ry="4.5" />
        <ellipse cx="132" cy="37.8" rx="7.5" ry="4.5" />
      </g>
      <g stroke="#e8edf7" stroke-width="1.4" stroke-linecap="round" opacity="0.85">
        <line x1="60" y1="78" x2="57" y2="75.6" />
        <line x1="84" y1="64.6" x2="84" y2="61.2" />
        <line x1="108" y1="51.2" x2="111" y2="48.8" />
        <line x1="132" y1="37.8" x2="132" y2="34.4" />
      </g>

      <ellipse cx="140" cy="36" rx="4" ry="2.4" fill="#f8fafc" opacity="0.9" />

      <ellipse cx="110" cy="100" rx="14" ry="8" fill="#0b1020" opacity="0.75" />
      <ellipse cx="110" cy="98.4" rx="9" ry="5.2" fill="#cbd5e1" opacity="0.55" />
    </symbol>

    <!-- Graphic EQ - a bank of sliders, caps tracing a curve. -->
    <symbol id="eq" viewBox="0 0 220 170">
      <ellipse cx="110" cy="146" rx="88" ry="16" fill="#05070f" opacity="0.45" />

      <path d="M10 66 L110 122 L110 148 L10 92 Z" fill="currentColor" opacity="0.5" />
      <path d="M210 66 L110 122 L110 148 L210 92 Z" fill="currentColor" opacity="0.3" />
      <path d="M110 10 L210 66 L110 122 L10 66 Z" fill="currentColor" />
      <path d="M110 10 L210 66 L110 122 L10 66 Z" fill="url(#topFace)" />

      <!-- Tracks run front-to-back (+w, +h); the bank steps across (+w, -h). -->
      <g stroke="#e8edf7" stroke-width="1.3" stroke-linecap="round" opacity="0.32">
        <line x1="57" y1="67" x2="75" y2="77" />
        <line x1="69.5" y1="60" x2="87.5" y2="70" />
        <line x1="82" y1="53" x2="100" y2="63" />
        <line x1="94.5" y1="46" x2="112.5" y2="56" />
        <line x1="107" y1="39" x2="125" y2="49" />
        <line x1="119.5" y1="32" x2="137.5" y2="42" />
        <line x1="132" y1="25" x2="150" y2="35" />
      </g>
      <g fill="#cbd5e1" opacity="0.8">
        <ellipse cx="60.6" cy="69" rx="4" ry="2.4" />
        <ellipse cx="77.6" cy="64.5" rx="4" ry="2.4" />
        <ellipse cx="95.5" cy="60.5" rx="4" ry="2.4" />
        <ellipse cx="111.6" cy="55.5" rx="4" ry="2.4" />
        <ellipse cx="119.6" cy="46" rx="4" ry="2.4" />
        <ellipse cx="126.7" cy="36" rx="4" ry="2.4" />
        <ellipse cx="134.7" cy="26.5" rx="4" ry="2.4" />
      </g>

      <ellipse cx="110" cy="104" rx="14" ry="8" fill="#0b1020" opacity="0.75" />
      <ellipse cx="110" cy="102.4" rx="9" ry="5.2" fill="#cbd5e1" opacity="0.55" />
    </symbol>

    <!-- Big-box fuzz - three knobs in a row, deeper walls. -->
    <symbol id="bigbox" viewBox="0 0 180 150">
      <ellipse cx="90" cy="130" rx="72" ry="14" fill="#05070f" opacity="0.45" />

      <path d="M8 56 L90 102 L90 130 L8 84 Z" fill="currentColor" opacity="0.5" />
      <path d="M172 56 L90 102 L90 130 L172 84 Z" fill="currentColor" opacity="0.3" />
      <path d="M90 10 L172 56 L90 102 L8 56 Z" fill="currentColor" />
      <path d="M90 10 L172 56 L90 102 L8 56 Z" fill="url(#topFace)" />

      <!-- Knobs on the width axis: step (24, -13.5). -->
      <g fill="#0b1020">
        <ellipse cx="66" cy="65.5" rx="8.5" ry="5" />
        <ellipse cx="90" cy="52" rx="8.5" ry="5" />
        <ellipse cx="114" cy="38.5" rx="8.5" ry="5" />
      </g>
      <g stroke="#e8edf7" stroke-width="1.5" stroke-linecap="round" opacity="0.85">
        <line x1="66" y1="65.5" x2="62.5" y2="62.6" />
        <line x1="90" y1="52" x2="90" y2="48" />
        <line x1="114" y1="38.5" x2="117.5" y2="35.6" />
      </g>

      <ellipse cx="124" cy="36" rx="4" ry="2.4" fill="#f8fafc" opacity="0.9" />

      <ellipse cx="90" cy="86" rx="15" ry="8.5" fill="#0b1020" opacity="0.75" />
      <ellipse cx="90" cy="84.5" rx="10" ry="5.8" fill="#cbd5e1" opacity="0.55" />
    </symbol>

    <!-- Wah / expression pedal - tapered treadle with a ribbed tread plate. -->
    <symbol id="wah" viewBox="0 0 190 148">
      <ellipse cx="96" cy="130" rx="74" ry="14" fill="#05070f" opacity="0.45" />
      <path d="M11 70 L69 103 L69 128 L11 95 Z" fill="currentColor" opacity="0.5" />
      <path d="M177 38 L69 103 L69 128 L177 63 Z" fill="currentColor" opacity="0.3" />
      <path d="M125 7 L177 38 L69 103 L11 70 Z" fill="currentColor" />
      <path d="M125 7 L177 38 L69 103 L11 70 Z" fill="url(#topFace)" />
      <path d="M123 22 L159 43 L71 94 L35 73 Z" fill="#0d1224" opacity="0.5" />
      <g stroke="#e8edf7" stroke-width="1.2" opacity="0.35">
        <line x1="109" y1="33" x2="78" y2="52" />
        <line x1="118" y1="39" x2="87" y2="57" />
        <line x1="127" y1="44" x2="96" y2="62" />
        <line x1="136" y1="49" x2="105" y2="67" />
      </g>
    </symbol>
  </defs>

  <!-- Row 1 -->
  <use href="#slab" x="18"  y="18"  width="220" height="170" color="#f4703a" />
  <use href="#box"  x="284" y="34"  width="150" height="128" color="#16b57f" />
  <use href="#wah"  x="470" y="12"  width="190" height="148" color="#9aa6bd" />
  <use href="#mini" x="702" y="48"  width="100" height="100" color="#1fb6c9" />

  <!-- Row 2 -->
  <use href="#mini" x="38"  y="252" width="100" height="100" color="#eec22a" />
  <use href="#eq"   x="176" y="214" width="220" height="170" color="#3d86e6" />
  <use href="#box"  x="444" y="240" width="150" height="128" color="#cf3fa4" />
  <use href="#bigbox" x="644" y="226" width="180" height="150" color="#e6483f" />

  <!-- Row 3 -->
  <use href="#box"  x="28"  y="442" width="150" height="128" color="#17a9bb" />
  <use href="#bigbox" x="216" y="428" width="180" height="150" color="#f4703a" />
  <use href="#mini" x="446" y="468" width="100" height="100" color="#3fc763" />
  <use href="#wah"  x="588" y="430" width="190" height="148" color="#b6c0d2" />
</svg>
